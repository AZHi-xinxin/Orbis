<!doctype html>
<html lang="zh-CN" data-tabletop="drawguess"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星夜桌游 · 你画我猜</title><link rel="stylesheet" href="drawguess.css"><link rel="stylesheet" href="/tabletop-music.css"><link rel="stylesheet" href="/tabletop-edge.css"></head>
<body><main id="app">
<header class="header"><button class="back icon" aria-label="返回大厅">‹</button><div class="heading"><h1>你画我猜 <span class="music">♫</span></h1><p><span id="phase">星星派对画室</span><span class="clock"></span></p></div><button class="small reconnect">重联</button><button class="small rules">规则</button></header>
<section id="lobby" class="lobby" hidden></section><section class="board" id="board"><div id="seats"></div>
<section class="easel" id="easel"><div class="paper-top"><button id="source" class="source word"><span class="source-label">这一笔画</span><strong>等待入席</strong></button><button class="expand icon" aria-label="全屏绘画" title="全屏绘画">⛶</button></div><div class="paper-body"><canvas id="drawing" width="1024" height="768" aria-label="可绘画画布"></canvas><div id="spectator-panel" class="spectator-panel" hidden></div><div class="paper-watermark">✦</div><div id="paper-message" class="paper-message" hidden></div></div><div class="paper-bottom"><span id="paper-status">你的画布</span><span class="saved"></span></div></section>
<div class="progress-chip" id="progress"></div></section>
<footer class="footer" id="footer"><div id="watch-controls" class="watch-controls" hidden><button id="watch-prev" aria-label="上一条接龙">‹</button><span id="watch-label"></span><button id="watch-next" aria-label="下一条接龙">›</button></div><div class="turn"><div class="turn-heading"><strong id="turn-title">欢迎入席</strong><span id="word-hint" hidden></span></div><span id="turn-note">这幅画只传给下一位</span></div><div class="tools" id="tools"><div class="brushes"><button class="tool selected" data-tool="pen" aria-label="画笔">✎</button><button class="tool" data-tool="eraser" aria-label="橡皮">▱</button><button class="tool" id="undo" aria-label="撤销">↶</button><button class="tool" id="redo" aria-label="重做">↷</button></div><span class="divider"></span><div class="palette" id="palette"></div><button class="stroke" aria-label="调整笔画粗细"><i></i></button></div><div id="choices" class="choices" hidden></div><div class="guess-row" id="guess-row" hidden><input id="guess" placeholder="你觉得画的是什么？" maxlength="30"><button class="primary" id="guess-send">提交猜词</button></div><div class="actions" id="actions"><button class="secondary" id="skip">跳过</button><button class="primary" id="submit">画好了 · 交给下一位</button></div><div class="room-actions" id="room-actions" hidden><button class="primary" id="room-return">返回大厅</button><button class="secondary" id="room-leave" hidden>我和助手一起离席</button></div><div class="support"><button class="history">本局记录</button><button class="leaderboard">总积分榜</button><span id="seating-note">人 · AI 交替入席</span><button class="menu">圆桌菜单</button></div></footer>
</main>
<dialog id="fullscreen" class="fullscreen"><div class="full-header"><button id="close-full" class="icon" aria-label="收起全屏">↙</button><div><b id="full-title">等待入席</b><small id="full-sub">星星派对画室</small></div><span class="clock"></span><button class="small" id="fit">适应画布</button></div><div id="full-paper"></div><div id="full-footer"></div></dialog>
<dialog id="reference" class="reference"><div class="full-header"><b>上一张画</b><button id="close-reference" class="icon" aria-label="收起图片">×</button></div><img id="reference-image" alt="上一位玩家的画"><div class="reference-note">只看画，不看词。想好后回到圆桌猜猜看。</div></dialog>
<dialog id="info" class="info"><button class="close small">关闭</button><h2 id="info-title"></h2><p id="info-body"></p></dialog><div class="toast" id="toast" role="status"></div>
<script type="module" src="drawguess.js"></script></body></html>
